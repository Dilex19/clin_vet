
services:
  app_vet:
    build: pruebaJPA\pruebaJPA
    mem_limit: 512m
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://clinica_vet:3306/prueba_jpa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER_NAME: admin
      DB_PASSWORD: admin
    restart: always
    depends_on:
      clinica_vet:
          condition: service_healthy
  clinica_vet:
    image: mysql:latest
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: prueba_jpa
    restart: always
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost"]
      timeout: 30s
      retries: 10

      